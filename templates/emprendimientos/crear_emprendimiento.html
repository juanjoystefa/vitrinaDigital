{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Añadir Emprendimiento - Sinapsis</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/stylesLanding.css' %}">
    <link rel="stylesheet" href="{% static 'css/stylesNavbar.css' %}">
</head>
<body class="bg-light">

    {% include 'includes/navbar.html' %}
    
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                
                <div class="card shadow-sm p-4" style="border-radius: 15px; border: 1px solid var(--borde);">
                    <div class="text-center mb-4">
                        <h3 class="mt-2" style="color: var(--tinta);">Postular Emprendimiento</h3>
                        <p class="text-muted">Llena los datos de tu idea para que sea revisada y publicada en la vitrina UAO.</p>
                    </div>
                    
                    <!-- enctype="multipart/form-data" es OBLIGATORIO para enviar la imagen -->
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <div class="d-flex gap-3 mt-4">
                            <a href="{% url 'emprendimientos' %}" class="btn btn-outline flex-grow-1 justify-content-center" style="border-radius: 999px;">
                                Cancelar
                            </a>
                            <button type="submit" class="btn flex-grow-1 justify-content-center" style="background-color: var(--tinta); color: white; border-radius: 999px;">
                                Enviar a Revisión
                            </button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </div>

</body>
</html>
