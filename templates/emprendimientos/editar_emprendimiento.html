{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Emprendimiento - Sinapsis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/stylesLanding.css' %}">
</head>

<body class="d-flex align-items-center" style="min-height: 100vh; background-color: var(--hueso);">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4" style="border-radius: 15px; border: 1px solid var(--borde);">
                    <div class="text-center mb-4">
                        <h3 class="mt-3" style="color: var(--tinta);">Editar Emprendimiento</h3>
                        <p class="text-muted">Actualiza los datos de: <b>{{ emprendimiento.nombre }}</b></p>
                    </div>

                    <!-- Agregamos la ruta completa a la que debe enviar los datos, incluyendo el parámetro 'next' -->
                    <form method="POST" action="{% url 'editar_emprendimiento' emprendimiento.idEmprendimiento %}?next={{ url_retorno }}" enctype="multipart/form-data">
                        {% csrf_token %}
                        <!-- Renderizamos el formulario -->
                        {{ form.as_p }}

                        <div class="d-flex gap-2 mt-4">
                            <a href="{% if '/' in url_retorno %}{{ url_retorno }}{% else %}{% url 'perfil' %}{% endif %}" class="btn btn-outline w-50 justify-content-center"  style="border-radius: 999px;">
                            Cancelar
                            </a>
                            <button type="submit" class="btn w-50 justify-content-center" style="background-color: var(--tinta); color: white; border-radius: 999px;">
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
