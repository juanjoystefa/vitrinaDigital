{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sinapsis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/stylesLanding.css' %}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <div class="text-center mb-4">
                        <img src="{% static 'img/uao-color.png' %}" width="80" alt="UAO">
                        <h3 class="mt-3">Iniciar Sesión</h3>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label>Usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label>Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" style="background-color: var(--tinta);">Entrar</button>
                    </form>
                    <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{% url 'registro' %}" style="color: var(--rojo);">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
