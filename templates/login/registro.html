{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Sinapsis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/stylesLanding.css' %}">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <div class="text-center mb-4">
                        <h3 class="mt-3">Crear Cuenta</h3>
                        <p class="text-muted">Únete a la red de Sinapsis UAO</p>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn w-100 mt-3" style="background-color: var(--rojo); color: white;">Registrarme</button>
                    </form>
                    <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color: var(--tinta);">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
